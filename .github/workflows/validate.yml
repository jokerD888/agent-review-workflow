name: Validate

on:
  push:
  pull_request:

jobs:
  windows-release-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release installer in an isolated profile
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'arw-release-installer-test'
          $fixture = @{
            'arw_windows_amd64.exe' = [Text.Encoding]::UTF8.GetBytes('arw')
            'arw-mcp_windows_amd64.exe' = [Text.Encoding]::UTF8.GetBytes('arw-mcp')
            'arw-global-rules.md' = [Text.Encoding]::UTF8.GetBytes('# test rules')
          }
          $manifest = ($fixture.GetEnumerator() | ForEach-Object { "{0}  {1}" -f [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($_.Value)).ToLowerInvariant(), $_.Key }) -join "`n"
          $fixture['checksums.txt'] = [Text.Encoding]::UTF8.GetBytes("$manifest`n")
          function Invoke-WebRequest {
            param([switch]$UseBasicParsing, [int]$MaximumRedirection, [string]$Uri, [string]$OutFile)
            $name = Split-Path -Leaf $Uri
            if (-not $fixture.ContainsKey($name)) { throw "Unexpected download: $Uri" }
            [IO.File]::WriteAllBytes($OutFile, $fixture[$name])
          }
          $env:LOCALAPPDATA = Join-Path $testRoot 'local-app-data'
          $env:USERPROFILE = Join-Path $testRoot 'home'
          $env:CODEX_HOME = Join-Path $testRoot 'codex'
          $originalPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $binDirectory = Join-Path $env:LOCALAPPDATA 'AgentReviewWorkflow\bin'
          try {
            ./installers/install.ps1 -Version test -ConfigureAgents -Force
            if (-not (Test-Path -LiteralPath (Join-Path $binDirectory 'arw.exe'))) { throw 'Release installer did not install arw.exe.' }
            if (-not (Test-Path -LiteralPath (Join-Path $env:CODEX_HOME 'config.toml'))) { throw 'Release installer did not respect CODEX_HOME.' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalPath, 'User')
          }

  linux-release-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release installer in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./installers/install.sh
          test_root="$(mktemp -d)"
          fixture="$test_root/fixture"
          mock_bin="$test_root/mock-bin"
          mkdir -p "$fixture" "$mock_bin"
          printf 'arw' > "$fixture/arw_linux_amd64"
          printf 'arw-mcp' > "$fixture/arw-mcp_linux_amd64"
          printf '# test rules\n' > "$fixture/arw-global-rules.md"
          (cd "$fixture" && sha256sum arw_linux_amd64 arw-mcp_linux_amd64 arw-global-rules.md > checksums.txt)
          cat > "$mock_bin/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          output=''
          url=''
          while [ "$#" -gt 0 ]; do
            if [ "$1" = '-o' ]; then output=$2; shift 2; else url=$1; shift; fi
          done
          cp "$ARW_INSTALLER_FIXTURE/${url##*/}" "$output"
          EOF
          chmod +x "$mock_bin/curl"
          release_home="$test_root/home"
          data_home="$test_root/data"
          config_home="$test_root/config"
          codex_home="$test_root/codex"
          HOME="$release_home" XDG_DATA_HOME="$data_home" XDG_CONFIG_HOME="$config_home" CODEX_HOME="$codex_home" ARW_INSTALLER_FIXTURE="$fixture" PATH="$mock_bin:/usr/bin:/bin" bash ./installers/install.sh --version test --configure-agents --force
          test -x "$data_home/agent-review-workflow/bin/arw"
          test -f "$codex_home/AGENTS.md"
          grep -Fqx "export PATH=\"$data_home/agent-review-workflow/bin:\$PATH\"" "$release_home/.profile"
