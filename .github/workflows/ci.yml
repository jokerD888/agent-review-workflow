name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - run: go test ./...
      - run: go build ./cmd/arw ./cmd/arw-mcp
      - if: runner.os == 'Linux'
        run: go test -tags=integration -timeout 3m ./internal/app
